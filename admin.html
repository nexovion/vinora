<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VIONORA Admin Dashboard</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #0b1020;
      color: #ffffff;
      min-height: 100vh;
    }

    .header {
      padding: 22px 18px;
      background: #11182b;
      border-bottom: 1px solid #24304d;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand {
      font-size: 26px;
      font-weight: 800;
    }

    .brand span {
      color: #53c7ff;
    }

    .logout-btn {
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 700;
    }

    .container {
      width: min(1200px, 94%);
      margin: 24px auto;
    }

    h1 {
      margin-bottom: 18px;
      font-size: 28px;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 14px;
      margin-bottom: 25px;
    }

    .card {
      background: #11182b;
      border: 1px solid #24304d;
      border-radius: 16px;
      padding: 18px;
    }

    .card-title {
      color: #9ba8c7;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .card-value {
      font-size: 30px;
      font-weight: 800;
    }

    .toolbar {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
      flex-wrap: wrap;
    }

    input,
    select {
      background: #11182b;
      color: white;
      border: 1px solid #2c395d;
      padding: 12px 14px;
      border-radius: 10px;
      outline: none;
    }

    .table-wrap {
      overflow-x: auto;
      background: #11182b;
      border: 1px solid #24304d;
      border-radius: 16px;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 1050px;
    }

    th,
    td {
      padding: 14px 12px;
      border-bottom: 1px solid #24304d;
      text-align: left;
      font-size: 14px;
    }

    th {
      color: #9ba8c7;
      background: #0f1628;
    }

    .status-select {
      min-width: 130px;
    }

    .save-btn {
      background: linear-gradient(90deg, #7568ff, #4fc3f7);
      border: none;
      padding: 9px 14px;
      border-radius: 9px;
      font-weight: 700;
      cursor: pointer;
    }

    .pending {
      color: #ffcc66;
      font-weight: 700;
    }

    .paid {
      color: #5ee2a0;
      font-weight: 700;
    }

    .error {
      color: #ff6b6b;
      margin: 10px 0;
    }

    .loading {
      color: #9ba8c7;
      padding: 20px;
    }

    @media (max-width: 800px) {
      .cards {
        grid-template-columns: repeat(2, 1fr);
      }

      .brand {
        font-size: 21px;
      }
    }
  </style>
</head>

<body>

  <div class="header">
    <div class="brand">VIONORA <span>ADMIN</span></div>
    <button class="logout-btn" onclick="logout()">Logout</button>
  </div>

  <div class="container">

    <h1>Admin Dashboard</h1>

    <div class="cards">

      <div class="card">
        <div class="card-title">Total Orders</div>
        <div class="card-value" id="totalOrders">0</div>
      </div>

      <div class="card">
        <div class="card-title">Pending Payments</div>
        <div class="card-value" id="pendingPayments">0</div>
      </div>

      <div class="card">
        <div class="card-title">Completed Orders</div>
        <div class="card-value" id="completedOrders">0</div>
      </div>

      <div class="card">
        <div class="card-title">Total Revenue</div>
        <div class="card-value" id="totalRevenue">₹0</div>
      </div>

    </div>

    <div class="toolbar">
      <input
        type="text"
        id="searchBox"
        placeholder="Search domain / service..."
        oninput="renderOrders()"
      />

      <select id="filterStatus" onchange="renderOrders()">
        <option value="all">All Orders</option>
        <option value="new">New</option>
        <option value="processing">Processing</option>
        <option value="completed">Completed</option>
        <option value="cancelled">Cancelled</option>
      </select>
    </div>

    <div id="message"></div>

    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>Date</th>
            <th>User ID</th>
            <th>Service</th>
            <th>Service Name</th>
            <th>External Fee</th>
            <th>VIONORA Fee</th>
            <th>Tax</th>
            <th>Total</th>
            <th>Payment</th>
            <th>Order Status</th>
            <th>Update</th>
          </tr>
        </thead>

        <tbody id="ordersBody">
          <tr>
            <td colspan="11" class="loading">Loading orders...</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <script src="config.js"></script>

  <script>
    const supabaseClient = supabase.createClient(
  window.VIONORA_CONFIG.SUPABASE_URL,
  window.VIONORA_CONFIG.SUPABASE_ANON_KEY
);

    let allOrders = [];

    async function checkAdminLogin() {
  const {
    data: { session }
  } = await supabaseClient.auth.getSession();

  if (!session) {
    window.location.href = "index.html";
    return false;
  }

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("role")
    .eq("id", session.user.id)
    .single();

  if (error) {
    alert("Unable to verify admin access.");
    window.location.href = "index.html";
    return false;
  }

  if (!profile || profile.role !== "admin") {
    alert("Access denied. Admin only.");
    window.location.href = "index.html";
    return false;
  }

  return true;
}

    async function loadOrders() {
      const loggedIn = await checkAdminLogin();

      if (!loggedIn) return;

      const { data, error } = await supabaseClient
        .from("orders")
        .select("*")
        .order("created_at", { ascending: false });

      if (error) {
        document.getElementById("message").innerHTML =
          `<div class="error">${error.message}</div>`;

        return;
      }

      allOrders = data || [];

      updateSummary();
      renderOrders();
    }

    function updateSummary() {
      const totalOrders = allOrders.length;

      const pending = allOrders.filter(
        order => order.payment_status === "pending"
      ).length;

      const completed = allOrders.filter(
        order => order.order_status === "completed"
      ).length;

      const revenue = allOrders
        .filter(order => order.payment_status === "paid")
        .reduce(
          (sum, order) =>
            sum + Number(order.total_amount || 0),
          0
        );

      document.getElementById("totalOrders").textContent = totalOrders;
      document.getElementById("pendingPayments").textContent = pending;
      document.getElementById("completedOrders").textContent = completed;
      document.getElementById("totalRevenue").textContent =
        "₹" + revenue.toFixed(2);
    }

    function renderOrders() {
      const search =
        document.getElementById("searchBox").value.toLowerCase();

      const statusFilter =
        document.getElementById("filterStatus").value;

      const filtered = allOrders.filter(order => {

        const matchesSearch =
          (order.service_name || "")
            .toLowerCase()
            .includes(search) ||
          (order.service_type || "")
            .toLowerCase()
            .includes(search);

        const matchesStatus =
          statusFilter === "all" ||
          order.order_status === statusFilter;

        return matchesSearch && matchesStatus;
      });

      const tbody = document.getElementById("ordersBody");

      if (filtered.length === 0) {
        tbody.innerHTML = `
          <tr>
            <td colspan="11" style="text-align:center;padding:25px;">
              No orders found
            </td>
          </tr>
        `;
        return;
      }

      tbody.innerHTML = filtered.map(order => {

        const created = order.created_at
          ? new Date(order.created_at).toLocaleString()
          : "-";

        return `
          <tr>

            <td>${created}</td>

            <td>${order.user_id || "-"}</td>

            <td>${order.service_type || "-"}</td>

            <td>${order.service_name || "-"}</td>

            <td>₹${Number(order.external_fee || 0).toFixed(2)}</td>

            <td>₹${Number(order.vionora_fee || 0).toFixed(2)}</td>

            <td>₹${Number(order.tax_amount || 0).toFixed(2)}</td>

            <td>
              <strong>
                ₹${Number(order.total_amount || 0).toFixed(2)}
              </strong>
            </td>

            <td class="${
              order.payment_status === "paid"
                ? "paid"
                : "pending"
            }">
              ${order.payment_status || "pending"}
            </td>

            <td>

              <select
                class="status-select"
                id="status-${order.id}"
              >

                <option value="new"
                  ${order.order_status === "new" ? "selected" : ""}>
                  New
                </option>

                <option value="processing"
                  ${order.order_status === "processing" ? "selected" : ""}>
                  Processing
                </option>

                <option value="completed"
                  ${order.order_status === "completed" ? "selected" : ""}>
                  Completed
                </option>

                <option value="cancelled"
                  ${order.order_status === "cancelled" ? "selected" : ""}>
                  Cancelled
                </option>

              </select>

            </td>

            <td>

              <button
                class="save-btn"
                onclick="updateOrderStatus('${order.id}')"
              >
                Save
              </button>

            </td>

          </tr>
        `;
      }).join("");
    }

    async function updateOrderStatus(orderId) {

      const select =
        document.getElementById(`status-${orderId}`);

      const newStatus = select.value;

      const { error } = await supabaseClient
        .from("orders")
        .update({
          order_status: newStatus
        })
        .eq("id", orderId);

      if (error) {
        alert("Update failed: " + error.message);
        return;
      }

      alert("Order status updated successfully");

      await loadOrders();
    }

    async function logout() {
      await supabaseClient.auth.signOut();
      window.location.href = "index.html";
    }

    loadOrders();
  </script>

</body>
</html>
